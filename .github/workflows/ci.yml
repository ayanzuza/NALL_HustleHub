name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - tests and dependency scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: API endpoint tests (Newman against the API with an in-memory database)
        env:
          RATE_LIMIT_AUTH_MAX: 1000
          RATE_LIMIT_BOOKING_MAX: 1000
          RATE_LIMIT_GLOBAL_MAX: 5000
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' \
            -keyout certs/key.pem -out certs/cert.pem
          node tests/support/devServerFake.js > fake-server.log 2>&1 &
          for i in $(seq 1 20); do
            wget --no-check-certificate -qO- https://localhost:5443/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          npx newman run postman/HustleHub-Part2.postman_collection.json --insecure
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  client:
    name: Client - lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  static-analysis:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (JavaScript, Node.js, React, secrets, OWASP Top 10)
        run: >
          semgrep scan
          --config p/javascript --config p/nodejs --config p/react
          --config p/secrets --config p/owasp-top-ten
          --metrics=off --exclude node_modules --exclude tests
          --text --output semgrep-report.txt || true
      - name: Show report
        run: cat semgrep-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.txt

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, client]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hustlehub-backend ./backend
      - run: docker build -t hustlehub-client ./client
