version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: hustlehub-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hustlehub-backend
    ports:
      - "5443:5443"
    environment:
      - PORT=5443
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/hustlehub
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hustlehub-client
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data: